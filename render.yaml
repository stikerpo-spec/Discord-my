services:
  - type: web
    name: discord-my
    runtime: node
    plan: starter
    buildCommand: npm ci && cd client && npm ci && npm run build
    preDeployCommand: npm run db:init
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: discord-my-db
          property: connectionString

databases:
  - name: discord-my-db
    plan: basic-256mb
